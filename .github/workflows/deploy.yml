# ══════════════════════════════════════════════════════════════════
#  GitHub Secrets (Settings → Secrets → Actions):
#
#  SSH_HOST          — Server IP yoki domain (masalan: 54.12.34.56)
#  SSH_USER          — SSH foydalanuvchi (masalan: ubuntu)
#  SSH_PRIVATE_KEY   — Private SSH kalit (.pem mazmuni)
#  SSH_PORT          — SSH port (odatda: 22)
#  DJANGO_SECRET_KEY — Django secret key (50+ tasodifiy belgi)
#  ALLOWED_HOSTS     — Vergul bilan: 54.12.34.56,mysite.uz,www.mysite.uz
# ══════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/parfum-crm
  DEPLOY_DIR: /app/parfum-crm
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────
  # 1. Testlar
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Migratsiyalar
        run: python manage.py migrate --noinput
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"

      - name: Testlar
        run: python manage.py test --verbosity=2
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"

  # ──────────────────────────────────────────────
  # 2. Docker image build va GHCR ga push
  # ──────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write
      actions: write

    outputs:
      image: ${{ env.IMAGE_NAME }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: GHCR ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build va push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Serverni yangilash
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Fayllarni serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,nginx/"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,DJANGO_SECRET_KEY,ALLOWED_HOSTS
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_DIR="/app/parfum-crm"

            # ── Docker ────────────────────────────────────────────────────
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi

            # ── Docker Compose plugin ──────────────────────────────────────
            if ! sudo docker compose version &>/dev/null; then
              PLUGIN_DIR="/usr/local/lib/docker/cli-plugins"
              sudo mkdir -p "$PLUGIN_DIR"
              sudo curl -fsSL \
                "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64" \
                -o "$PLUGIN_DIR/docker-compose"
              sudo chmod +x "$PLUGIN_DIR/docker-compose"
            fi

            # ── Papka tayyorlash ───────────────────────────────────────────
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$USER:$USER" "$DEPLOY_DIR"
            touch "$DEPLOY_DIR/db.sqlite3"

            # ── .env yozish ────────────────────────────────────────────────
            printf 'SECRET_KEY=%s\nALLOWED_HOSTS=%s\nDEBUG=False\nIMAGE=%s\n' \
              "$DJANGO_SECRET_KEY" "$ALLOWED_HOSTS" "$IMAGE" \
              > "$DEPLOY_DIR/.env"
            chmod 600 "$DEPLOY_DIR/.env"

            # ── GHCR login ─────────────────────────────────────────────────
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # ── Image pull ─────────────────────────────────────────────────
            cd "$DEPLOY_DIR"
            sudo docker compose pull

            # ── Konteynerlarni ishga tushirish ─────────────────────────────
            sudo docker compose up -d --no-build --remove-orphans --force-recreate

            # ── Web tayyor bo'lishini kutish ───────────────────────────────
            echo "Web konteyneri kutilmoqda..."
            timeout 60 bash -c \
              'until sudo docker compose exec -T web python -c "import sys;sys.exit(0)" &>/dev/null; do sleep 3; done'

            # ── Migratsiyalar ──────────────────────────────────────────────
            sudo docker compose exec -T web python manage.py migrate --noinput

            # ── Static fayllar ─────────────────────────────────────────────
            sudo docker compose exec -T web python manage.py collectstatic --noinput

            # ── Eski imagelarni tozalash ───────────────────────────────────
            sudo docker image prune -f

            echo "✓ Deploy muvaffaqiyatli yakunlandi!"
