# ═══════════════════════════════════════════════════════════════════
#  GitHub Secrets (Settings → Secrets → Actions):
#
#  SSH_HOST          — Server IP yoki domain (masalan: 54.12.34.56)
#  SSH_USER          — SSH foydalanuvchi (masalan: ubuntu)
#  SSH_PRIVATE_KEY   — Private SSH kalit (.pem mazmuni)
#  SSH_PORT          — SSH port (odatda: 22)
#  DJANGO_SECRET_KEY — Django secret key (50+ tasodifiy belgi)
#  ALLOWED_HOSTS     — Vergul bilan: 54.12.34.56,uzbekai.uz,www.uzbekai.uz
# ═══════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/parfum-crm

jobs:
  # ──────────────────────────────────────────────
  # 1. Run Django tests
  # ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: ci-only-secret-key-not-used-in-production

      - name: Run tests
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: ci-only-secret-key-not-used-in-production

  # ──────────────────────────────────────────────
  # 2. Build Docker image and push to GHCR
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Deploy to production server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,nginx/"
          target: "/app/parfum-crm"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE_NAME }}:latest
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,DJANGO_SECRET_KEY,ALLOWED_HOSTS
          script: |
            set -euo pipefail
            DEPLOY_DIR="/app/parfum-crm"

            # ── 1. Docker o'rnatish ────────────────────────────────────────
            if ! command -v docker >/dev/null 2>&1; then
              echo ">>> Docker o'rnatilmoqda..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
              echo ">>> Docker o'rnatildi"
            fi
            echo ">>> Docker: $(sudo docker --version)"

            # ── 2. Docker Compose plugin o'rnatish ─────────────────────────
            if ! sudo docker compose version >/dev/null 2>&1; then
              echo ">>> Docker Compose o'rnatilmoqda..."
              DOCKER_PLUGIN="/usr/local/lib/docker/cli-plugins"
              sudo mkdir -p "${DOCKER_PLUGIN}"
              sudo curl -SL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64" \
                -o "${DOCKER_PLUGIN}/docker-compose"
              sudo chmod +x "${DOCKER_PLUGIN}/docker-compose"
            fi
            echo ">>> Docker Compose: $(sudo docker compose version)"

            # ── 3. Papka va SQLite fayl tayyorlash ────────────────────────
            sudo mkdir -p "${DEPLOY_DIR}"
            sudo chown -R "$USER:$USER" "${DEPLOY_DIR}"
            touch "${DEPLOY_DIR}/db.sqlite3"

            # ── 4. .env fayl yaratish ──────────────────────────────────────
            # IMAGE ham .env ga yoziladi — docker compose uni image: ${IMAGE} uchun o'qiydi
            printf 'SECRET_KEY=%s\nALLOWED_HOSTS=%s\nDEBUG=False\nIMAGE=%s\n' \
              "${DJANGO_SECRET_KEY}" "${ALLOWED_HOSTS}" "${IMAGE}" \
              > "${DEPLOY_DIR}/.env"
            chmod 600 "${DEPLOY_DIR}/.env"
            echo ">>> .env: OK"

            # ── 5. ghcr.io ga login ────────────────────────────────────────
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            echo ">>> ghcr.io: OK"

            # ── 6. Image pull va konteynerlarni ishga tushirish ────────────
            cd "${DEPLOY_DIR}"
            sudo docker compose pull
            sudo docker compose up -d --no-build --remove-orphans
            echo ">>> Konteynerlar: OK"

            # ── 7. Migratsiyalar ───────────────────────────────────────────
            sudo docker compose exec -T web python manage.py migrate --noinput
            echo ">>> Migratsiyalar: OK"

            # ── 8. Eski imagelarni tozalash ────────────────────────────────
            sudo docker image prune -f

            echo ""
            echo "DEPLOY MUVAFFAQIYATLI YAKUNLANDI!"
